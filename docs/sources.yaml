# Sources register for the Mission Island knowledge base.
# One entry per source. Pages link to entries by id. Rules: .agents/skills/mission-island-knowledge-keeper/references/sources.md
# opened: false means no one has yet read the source to check the claim. Claims resting only on it are unsourced.
# Claim status: unsourced, then sourced (an agent opened the source and recorded a quote), then checked (a person checked the quote against the page).
# tier: 1 recognised body or peer-reviewed · 2 primary · 3 reputable secondary · 4 community or encyclopedia

- id: wikipedia-osborne-fire-finder
  title: Osborne Fire Finder
  publisher: Wikipedia
  url: https://en.wikipedia.org/wiki/Osborne_Fire_Finder
  archived: https://web.archive.org/web/20261122203509/https://en.wikipedia.org/wiki/Osborne_Fire_Finder
  accessed: 2026-11-22
  opened: true
  tier: 4
  region: United States
  note: Read by an agent, which summarised it. The article cites US Forest Service technical notes, which returned an error and still need checking as the primary source.
  supports:
    - claim: A lookout's fire finder gives a bearing and a rough distance from one tower; crossing bearings from two or more towers fixes the position precisely.
      quote: To add on the next read; the agent's summary is not a quote.
      used-in: field-guide/processes/wildfire.md#fighting-a-fire

- id: usfs-osborne-firefinder
  title: The Osborne Firefinder
  publisher: US Forest Service
  url: https://www.fs.usda.gov/t-d/pubs/html/03511311/03511311.html
  archived: https://web.archive.org/web/20261122210050/https://www.fs.usda.gov/t-d/pubs/html/03511311/03511311.html
  accessed: 2026-11-23
  opened: true
  tier: 1
  region: United States
  note: San Dimas Technology and Development Center tech tip 0351 1311-SDTDC, October 2003, by Joe Fleming and Rich G. Robertson. The routine quoted is a volunteer lookout's 1996 account that the note reprints. The live page returned 403 to automated reading on 2026-11-22 and 2026-11-23, so the quotes were read directly (not through a fetcher) from the archived copy.
  supports:
    - claim: A single lookout can estimate the distance to a smoke.
      quote: "estimate the miles between the tower and the sight of the smoke using the metal tape on the Osborne Firefinder"
      quote-match: unfetchable (2026-11-23)
      used-in: field-guide/processes/wildfire.md#fighting-a-fire
    - claim: A lookout sights the base of the smoke with the fire finder and reads the horizontal angle in degrees and minutes, then the vertical angle.
      quote: "Once the hair is properly aligned with the smoke you take the horizontal reading in degrees and minutes."
      quote-match: unfetchable (2026-11-23)
      used-in: field-guide/practices/spotting-and-ranging.md#how-its-organised

