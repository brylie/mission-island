- id: fao-road-design-watersheds
  title: "Watershed management field manual: road design and construction in sensitive watersheds, chapter 3: Road design"
  publisher: Food and Agriculture Organization of the United Nations (FAO Conservation Guide 13/5)
  url: https://www.fao.org/4/t0099e/T0099e03.htm
  archived: https://web.archive.org/web/20261123192907/https://www.fao.org/4/t0099e/T0099e03.htm
  accessed: 2026-11-23
  opened: true
  tier: 1
  region: International; the manual draws largely on research from the US Pacific Northwest
  note: Rome, 1998. Contents page https://www.fao.org/4/t0099e/T0099E00.htm (archived https://web.archive.org/web/20261123192843/https://www.fao.org/4/t0099e/T0099E00.htm). The manual's chapters are separate pages, so each chapter has its own entry; see fao-road-drainage-watersheds and fao-road-slope-protection-watersheds. Read directly with curl, not through a fetcher. Quotes avoid the degree sign, which the page encodes as Latin-1.
  supports:
    - claim: The road engineer's usual goal is to balance earthwork, so the fill equals the cut allowing for bulking and shrinkage.
      quote: "the goal of the road engineer is to balance earthwork so that the volume of fill equals the volume of cut"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#cut-and-fill
    - claim: Where side slopes exceed about 50–55%, or are unstable, a road may need full bench construction, with the excavated material end hauled away.
      quote: "When sideslopes exceed 50 - 55 percent or when unstable slope conditions are present, it may be necessary to consider full bench construction"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#cut-and-fill
    - claim: In full bench construction the excavated material is carried to a safe place.
      quote: "Excavated material in this case must be end hauled to a safe location."
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#cut-and-fill
    - claim: Fill slopes can be built up to 36–38°, but common practice keeps them to about 34°.
      quote: "Fill slopes can be constructed up to a maximum slope angle of 36"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#cut-and-fill
    - claim: Common practice keeps fill slopes to about 34°.
      quote: "Common practice is to restrict fill slopes to 34"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#cut-and-fill
    - claim: A fill slope of about 34° is a rise-to-run ratio of 1:1.5, which is 1.5 horizontal to 1 vertical.
      quote: "which corresponds to a rise: run ratio of 1:1.5"
      quote-match: exact (2026-11-23)
      used-in: conventions.md#space
    - claim: Fill slopes erode and slough more readily than cut slopes.
      quote: "Fill slopes are more succeptible to erosion and sloughing than cut slopes."
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#cut-and-fill
    - claim: The tightest curve a road can have depends on the vehicles that use it.
      quote: "Minimum curve radius is vehicle dependent"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#grade
    - claim: On level ground a minimum grade of 2% keeps water from ponding.
      quote: "This can be accomplished by establishing a minimum grade of 2 percent and by rolling the grade."
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#grade
    - claim: The road surfacing section gives a crown of 3 to 5 cm per metre of half-width.
      quote: "A crowned surface of 3 to 5 cm/m of half-width will ensure adequate movement of surface water"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#water
    - claim: Rutted road surfaces yield about twice the sediment of unrutted ones.
      quote: "Sediment yield from rutted surfaces is about twice that of unrutted road surfaces"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#what-goes-wrong
    - claim: Seepage at the toe of a fill can cause a slump failure.
      quote: "Rotational or Slump fill failure brought about by seepage at the toe of the fill"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#what-goes-wrong

- id: fao-road-drainage-watersheds
  title: "Watershed management field manual: road design and construction in sensitive watersheds, chapter 4: Drainage design"
  publisher: Food and Agriculture Organization of the United Nations (FAO Conservation Guide 13/5)
  url: https://www.fao.org/4/t0099e/T0099e04.htm
  archived: https://web.archive.org/web/20261123192954/https://www.fao.org/4/t0099e/T0099e04.htm
  accessed: 2026-11-23
  opened: true
  tier: 1
  region: International; the manual draws largely on research from the US Pacific Northwest
  note: Rome, 1998. Chapter 4 of the manual in fao-road-design-watersheds. Read directly with curl, not through a fetcher.
  supports:
    - claim: Drainage is the most important part of road design.
      quote: "Provision for adequate drainage is of paramount importance in road design and cannot be overemphasized."
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#water
    - claim: Cut and fill failures, surface erosion and weakened subgrades come from poor drainage.
      quote: "are all products of inadequate or poorly designed drainage"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#water
    - claim: A crowned road falls at 3 to 10 percent to each side of the centreline.
      quote: "The crowned surface slopes at 3 to 10 percent from either side of the road centerline."
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#water
    - claim: Crowned roads shed water fastest.
      quote: "Crowned surfaces provide the fastest water removal"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#water
    - claim: An outsloped road falls at 3 to 5 percent toward its downhill side.
      quote: "Outsloping is achieved by grading the surface at 3 to 5 percent cross slope toward the downhill side of the road."
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#water
    - claim: Outsloped roads are simple to build and maintain.
      quote: "Outsloped roads are simple to build and to maintain."
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#water
    - claim: An insloped road falls at 3 to 5 percent toward its uphill side.
      quote: "Insloping is achieved by grading the road surface towards the uphill side of the road at a 3 to 5 percent grade."
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#water
    - claim: Intercepting (rolling) dips are useful only on grades under 10%.
      quote: "their usefulness is limited to road grades less than 10 percent"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#water
    - claim: Traffic forms ruts, which carry water down the road.
      quote: "In time, traffic will cause ruts to form, channeling surface water longitudinally down the road."
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#water
    - claim: Water can pond above a road fill, weakening or eroding the subgrade.
      quote: "water will pond above the road fill"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#water
    - claim: Fords suit crossings subject to flash floods, storm peaks or heavy debris, which wash over the road.
      quote: "Fords are a convenient way to provide waterway crossing in areas subject to flash floods"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#fords
    - claim: A ford's surface has to be hardened with concrete or large rock.
      quote: "The fill surface has to be hardened either by concrete or large rock"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#fords
    - claim: Roads should climb away from stream crossings in both directions, so high water doesn't run along the road.
      quote: "roads should climb away from channel crossings in both directions wherever practical"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#fords

