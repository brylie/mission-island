      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#grade
    - claim: Short lengths under 200 m may reach 12.5%.
      quote: "200 metres) up to 12.5 per cent"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#grade
    - claim: The minimum gradient is 2%, except over short crests and sags.
      quote: "minimum gradient: two per cent except over short sections on crests and sags"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#grade
    - claim: The specification's running width is 3.4 m.
      quote: "3.4 metres running width"
      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#where-the-island-differs
    - claim: Road stone must be durable, because stone that breaks down can cause diffuse pollution.
