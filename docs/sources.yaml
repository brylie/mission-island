      quote-match: exact (2026-11-23)
      used-in: field-guide/practices/forest-roads.md#water
    - claim: Drains are at least 150 mm below the formation edge, with a fall of at least 2%.
      quote: "Drains must have a depth of not less than 150 millimetres below the formation edge and a longitudinal gradient of not less than two per cent."
