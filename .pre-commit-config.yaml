minimum_prek_version: "0.4.8"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: mission-island-quality
        name: Lint and type check
        entry: npm run quality:static
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      # CI skips this hook and runs the same tests once, under coverage.
      - id: mission-island-tests
        name: Tests
        entry: npm test
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: mission-island-quality-push
        name: Uncached lint, unused code and build
        entry: npm run quality:push
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: mission-island-audit
        name: Audit npm dependencies
        entry: npm run audit
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
