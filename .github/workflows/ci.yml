name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Run repository checks, lint, type check, and tests
        run: mise exec -- prek run --all-files --hook-stage pre-commit --verbose --show-diff-on-failure
      - name: Check unused code, build, and audit dependencies
        run: mise exec -- prek run --all-files --hook-stage pre-push --verbose
      - name: Check test coverage
        run: npm run coverage
